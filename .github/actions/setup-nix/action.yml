name: Set up Nix with KVM
description: Frees disk space, enables KVM for the VM tests and installs Nix.
runs:
  using: composite
  steps:
    - name: Free disk space (the system closure plus the test disk image need ~15 GB)
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
        df -h /

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          system-features = nixos-test benchmark big-parallel kvm
          max-jobs = auto
